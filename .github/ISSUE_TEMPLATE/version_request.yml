name: Version request
description: Ask for SignIt Modern on a Minecraft version or loader that is not supported yet.
title: "[Version request] Minecraft "
labels: ["version request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking! SignIt Modern is made and tested for **Minecraft 26.3**, for **Fabric and NeoForge**.
        Every new version means a full test round (client, dedicated server, all automated game tests, join tests with
        clients without the mod), so requests with a real use help decide what comes next.

        Please check the [open version requests](https://github.com/CptGummiball/SignItModern/issues?q=is%3Aissue+label%3A%22version+request%22)
        first: if your version is already asked for, give that issue a :+1: instead of opening a new one.

  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      description: "The exact version you would like, e.g. 1.21.11 or 26.4."
      placeholder: "26.4"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      multiple: true
      options:
        - Fabric
        - NeoForge
        - Other (write it below)
    validations:
      required: true

  - type: dropdown
    id: use
    attributes:
      label: Where would you use it?
      options:
        - On a server
        - In a public modpack
        - In a private modpack / with friends
        - Singleplayer
        - Other
    validations:
      required: true

  - type: input
    id: pack
    attributes:
      label: Modpack or server (optional)
      description: "A link or name helps to see which other mods SignIt Modern has to work with on that version."
      placeholder: "https://www.curseforge.com/minecraft/modpacks/..."

  - type: textarea
    id: why
    attributes:
      label: Anything else?
      description: "Why this version, other mods you use with it, ..."
    validations:
      required: false
